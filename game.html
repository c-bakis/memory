<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body class="game" data-page="game">
    <header class="game-header">
        <section class="game-header__counter">
            <div class="game-header__counter--blue">
                <dl>
                    <dt>Blue</dt>
                    <dd>
                        <output id="blue-score" aria-live="polite">
                            0
                        </output>
                    </dd>
                </dl>
            </div>
            <div class="game-header__counter--orange">
                <dl>
                    <dt>Orange</dt>
                    <dd>
                        <output id="orange-score" aria-live="polite">
                            0
                        </output>
                    </dd>
                </dl>
            </div>
        </section>
        <section class="game-header__current-player-section">
        <div class="game-header__current-player">
            <h2>Current Player:</h2>
            <span class="game-header__current-player-icon" role="img" aria-label="Current Player"></span>
        </div>
        </section>
        <button class="game-header__exit">
            <img src="./assets/img/move_item.svg" alt="" class="game-header__exit-icon">
            Exit game
        </button>
    </header>

    <main class="game-main">
        <div class="game-board" id="game-container">
            <button type="button" class="game-card" aria-label="Card">
                <span class="game-card__inner">
                    <span class="game-card__face game-card__face--back"></span>
                    <span class="game-card__face game-card__face--front"></span>
                </span>
            </button>
        </div>
    </main>

    <dialog class="game-dialog" id="exit-dialog" aria-labelledby="exit-dialog-title">
        <h2 class="game-dialog__title" id="exit-dialog-title">Are you sure you want to quit the game?</h2>
        <div class="game-dialog__actions">
            <button type="button" class="game-dialog__btn game-dialog__btn--confirm" id="exit-confirm">Yes, quit</button>
            <button type="button" class="game-dialog__btn" id="exit-cancel">No, continue</button>
        </div>
    </dialog>
    
    <script type="module" src="./src/main.ts"></script>
</body>
</html>
